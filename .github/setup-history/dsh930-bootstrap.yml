name: dsh930 source and Node 24 bootstrap

on:
  push:
    branches: [main]
    paths: [.github/workflows/dsh930-bootstrap.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dsh930-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Import the pinned complete upstream snapshot
        shell: bash
        env:
          UPSTREAM_COMMIT: 639ed015397290b3745d163aafe02ffee4aa3f84
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = 'wmqfl861/dsh930'
          if git ls-remote --exit-code --heads origin 'dev/node24' >/dev/null 2>&1; then
            echo 'Refusing to replace existing dev/node24. Continue on its current commit instead.' >&2
            exit 1
          fi
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch --depth=1 upstream "$UPSTREAM_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_COMMIT"
          mkdir -p "$RUNNER_TEMP/dsh930-export"
          git archive --format=tar "$UPSTREAM_COMMIT" | gzip > "$RUNNER_TEMP/dsh930-export/upstream-source.tar.gz"
          git switch -c dev/node24
          git archive "$UPSTREAM_COMMIT" | tar -x
          # Keep upstream automation byte-for-byte without running release jobs
          # or queues requiring DeepSeek's private runners in this new repository.
          mkdir -p .github/upstream-workflows
          find .github/workflows -maxdepth 1 -type f ! -name dsh930-bootstrap.yml -exec mv -t .github/upstream-workflows {} +
          mkdir -p .dsh930
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const report = {
            upstream: 'deepseek-ai/deepseek-harness',
            commit: process.env.UPSTREAM_COMMIT,
            imported: 'complete tracked source snapshot; not the full commit history',
            upstreamWorkflows: '.github/upstream-workflows (original bytes retained, inactive)',
            node: process.version,
            dependencyUpgrade: 'not yet executed',
            build: 'not yet executed',
            tests: 'not yet executed'
          };
          fs.writeFileSync('.dsh930/bootstrap.json', JSON.stringify(report, null, 2) + '\n');
          fs.writeFileSync('.nvmrc', process.versions.node + '\n');
          fs.writeFileSync('.node-version', process.versions.node + '\n');
          JS
          git config user.name 'dsh930 setup'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          # Imported vendor/cosmokit/README.md already has trailing whitespace.
          # Preserve the upstream bytes and check only newly authored setup files.
          git diff --cached --check -- .github/workflows/dsh930-bootstrap.yml .dsh930 .nvmrc .node-version
          git -c core.hooksPath=/dev/null commit -m "chore: import upstream 639ed015 and select Node 24"
          git push origin HEAD:refs/heads/dev/node24
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/dsh930-export/dsh930-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/dsh930-export/commit.txt"
      - name: Export the actual Node 24 runtime
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh930-export"
          node --version | tee "$RUNNER_TEMP/dsh930-export/node-version.txt"
          node_root="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          tar -czf "$RUNNER_TEMP/dsh930-export/node24-linux-x64.tar.gz" -C "$node_root" .
          cd "$RUNNER_TEMP/dsh930-export"
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh930-source-node24
          path: ${{ runner.temp }}/dsh930-export/
          if-no-files-found: error
          retention-days: 7
