name: dsh930 Alpha checks

on:
  push:
    branches: [feat/alpha-team-v1]
    paths: ['alpha/**', '.dsh/skills/alpha-*/**', '.github/workflows/dsh930-alpha.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpha:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Test the Alpha engine without network or model credentials
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alpha-results"
          node --version > "$RUNNER_TEMP/alpha-results/node.txt"
          node --test alpha/tests/*.test.mjs | tee "$RUNNER_TEMP/alpha-results/tests.log"
          node alpha/cli.mjs inspect > "$RUNNER_TEMP/alpha-results/inspect.json"
          node alpha/cli.mjs fixture "$RUNNER_TEMP/alpha-fixtures" > "$RUNNER_TEMP/alpha-results/fixture.json"
          code=0
          node alpha/cli.mjs preflight > "$RUNNER_TEMP/alpha-results/preflight.json" || code=$?
          test "$code" = 2
      - name: Install the exact lint tool outside the workspace
        run: npm install --prefix "$RUNNER_TEMP/alpha-lint" --ignore-scripts --no-audit --no-fund oxlint@1.86.0
      - name: Lint MJS files explicitly, do not inherit the root MJS exclusion
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/alpha-lint/node_modules/oxlint/bin/oxlint" -c alpha/oxlint.json --no-ignore alpha --threads 1 | tee "$RUNNER_TEMP/alpha-results/lint.log"
          git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dsh930-alpha-check-results
          path: ${{ runner.temp }}/alpha-results/
          retention-days: 14
          if-no-files-found: error
