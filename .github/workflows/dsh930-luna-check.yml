name: dsh930 Luna configuration and gateway check
on:
  push:
    branches: [feat/alpha-luna-smoke]
    paths: ['alpha/**', '.github/workflows/dsh930-luna-check.yml']
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Run one bounded live test (at most 5 inference requests; no team run)'
        type: boolean
        default: false
      max_usd:
        description: 'Reservation ceiling in USD, no more than 0.25'
        type: string
        default: '0.25'
      input_usd_per_million:
        description: 'Verified maximum gateway input rate; leave empty to block spending'
        type: string
        default: ''
      output_usd_per_million:
        description: 'Verified maximum gateway output rate; leave empty to block spending'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: luna-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Alpha and offline wire regressions (no model credentials)
        run: |
          set -euo pipefail
          mkdir -p .artifacts/luna-repair
          node --test alpha/tests/*.test.mjs | tee .artifacts/luna-repair/alpha.log
          node --test .devcontainer/check-env.test.mjs | tee .artifacts/luna-repair/config.log
          git diff --exit-code
          git rev-parse HEAD > .artifacts/luna-repair/source-commit.txt
      - name: Explicit MJS lint
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/alpha-lint" --ignore-scripts --no-audit --no-fund oxlint@1.86.0
          node "$RUNNER_TEMP/alpha-lint/node_modules/oxlint/bin/oxlint" -c alpha/oxlint.json --no-ignore alpha --threads 1 | tee .artifacts/luna-repair/lint.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: luna-offline-results
          path: .artifacts/luna-repair/
          retention-days: 14
  provider:
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the pinned Node 24 development image
        run: docker build -f .devcontainer/Dockerfile -t dsh930-luna-dev .
      - name: Frozen install, native build, full build and lint
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/dsh930-home -e CI=true \
            -v "$PWD:/workspaces/dsh930" -w /workspaces/dsh930 dsh930-luna-dev bash .devcontainer/setup.sh
      - name: Full provider regression plus native DSH wire test (no real model)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/dsh930-home -e CI=true \
            -v "$PWD:/workspaces/dsh930" -w /workspaces/dsh930 dsh930-luna-dev bash -euc '
              mkdir -p "$HOME"
              node alpha/provider-regression.mjs .artifacts/luna-provider
              node alpha/luna-native-smoke.mjs .artifacts/luna-native --fixture
              node alpha/tests/native-smoke.mjs
            '
          git diff --exit-code
      - name: Explicit live test or safe credential/budget readiness report
        env:
          ALPHA_SMOKE_API_KEY: ${{ secrets.ALPHA_SMOKE_API_KEY }}
          ALPHA_SMOKE_ALLOW_LIVE: ${{ inputs.run_live && '1' || '0' }}
          ALPHA_SMOKE_MAX_USD: ${{ inputs.max_usd || '0.25' }}
          ALPHA_SMOKE_INPUT_USD_PER_MILLION: ${{ inputs.input_usd_per_million }}
          ALPHA_SMOKE_OUTPUT_USD_PER_MILLION: ${{ inputs.output_usd_per_million }}
        run: |
          set +e
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/dsh930-home -e CI=true \
            -e ALPHA_SMOKE_API_KEY -e ALPHA_SMOKE_ALLOW_LIVE -e ALPHA_SMOKE_MAX_USD \
            -e ALPHA_SMOKE_INPUT_USD_PER_MILLION -e ALPHA_SMOKE_OUTPUT_USD_PER_MILLION \
            -v "$PWD:/workspaces/dsh930" -w /workspaces/dsh930 dsh930-luna-dev \
            node alpha/luna-controlled.mjs .artifacts/luna-live
          status=$?
          if [ "$ALPHA_SMOKE_ALLOW_LIVE" = 1 ]; then exit "$status"; fi
          # A readiness-only run never claims live success; its report retains the blocker.
          test "$status" -eq 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: luna-provider-native-and-readiness
          path: |
            .artifacts/dsh930-development/
            .artifacts/luna-provider/
            .artifacts/luna-native/native-report.json
            .artifacts/luna-live/controlled-report.json
            .artifacts/luna-live/native-report.json
          retention-days: 14
