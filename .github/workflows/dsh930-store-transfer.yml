name: dsh930 package cache transfer

on:
  push:
    branches: [ops/artifact-transfer]
    paths: [.github/workflows/dsh930-store-transfer.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh930-package-store
          run-id: 36813104476
          github-token: ${{ github.token }}
          repository: wmqfl861/dsh930
          path: ${{ runner.temp }}/original
      - name: Split the package cache without altering its contents
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parts"
          split -b 240M -d "$RUNNER_TEMP/original/package-store.tar.gz" "$RUNNER_TEMP/parts/store.part-"
          cd "$RUNNER_TEMP/parts"
          sha256sum store.part-* > SHA256SUMS
          sha256sum "$RUNNER_TEMP/original/package-store.tar.gz" > ORIGINAL_SHA256
          test "$(find . -name 'store.part-*' | wc -l)" -le 4
      - uses: actions/upload-artifact@v4
        with:
          name: dsh930-vite8-store-part-00
          path: ${{ runner.temp }}/parts/store.part-00
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dsh930-vite8-store-part-01
          path: ${{ runner.temp }}/parts/store.part-01
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dsh930-vite8-store-part-02
          path: ${{ runner.temp }}/parts/store.part-02
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dsh930-vite8-store-part-03
          path: ${{ runner.temp }}/parts/store.part-03
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dsh930-vite8-store-checksums
          path: |
            ${{ runner.temp }}/parts/SHA256SUMS
            ${{ runner.temp }}/parts/ORIGINAL_SHA256
          retention-days: 7
