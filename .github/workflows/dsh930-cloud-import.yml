name: dsh930 import cloud development baseline

on:
  push:
    branches: [ops/artifact-transfer]
    paths: [.github/workflows/dsh930-cloud-import.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b060911e1deb03aadf317ed4eb44227ab9d6d544
          fetch-depth: 0
          persist-credentials: false
      - name: Read and verify the reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/transfer"
          gh api "repos/wmqfl861/dsh930/contents/.dsh930/cloud-baseline.patch.gz.b64?ref=$GITHUB_SHA" --jq .content | base64 -d > "$RUNNER_TEMP/transfer/payload.b64"
          python3 - <<'PY'
          import os, pathlib, hashlib, base64, gzip
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'transfer'
          text = (root / 'payload.b64').read_text().strip()
          assert hashlib.sha256(text.encode()).hexdigest() == '256acb869b1f41121efcb023efa52bc04788e7f44df316d28dad223e9831fcd9'
          for start, end, replacement in [(13017, 13017, 'V'), (12175, 12176, ''), (10980, 10981, ''), (8922, 8923, '')]:
              text = text[:start] + replacement + text[end:]
          assert hashlib.sha256(text.encode()).hexdigest() == 'fc9127c3696bce45c11ca5976cbe2456617db478d94743f96ae9dd365b240545'
          patch = gzip.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ca6e3914d9c1ac49a416a7c247ae0ff6dc8d8e1ef9a653b6a2f01676465e8860'
          (root / 'cloud-baseline.patch').write_bytes(patch)
          PY
      - name: Apply source changes and synchronize the stale MCP dependency assertion
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/transfer/cloud-baseline.patch"
          git apply "$RUNNER_TEMP/transfer/cloud-baseline.patch"
          # GITHUB_TOKEN cannot edit workflows. Those changes use the authorized GitHub connection separately.
          git restore --source HEAD --worktree .github/workflows/dsh930-bootstrap.yml .github/workflows/dsh930-environment.yml .github/workflows/dsh930-retrieve.yml
          rm .github/workflows/dsh930-development.yml
          python3 - <<'PY'
          import pathlib, json
          root = pathlib.Path('packages/subagent/subagent-claude-code')
          assert json.loads((root / 'package.json').read_text())['dependencies']['@modelcontextprotocol/sdk'] == '^1.31.0'
          path = root / 'tests/subagent-claude-code.spec.ts'
          text = path.read_text()
          assert text.count("'^1.29.0'") == 1
          path.write_text(text.replace("'^1.29.0'", "'^1.31.0'"))
          PY
          git add --all
          git diff --cached --check
          git config user.name 'dsh930 setup'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: freeze Node 24 cloud environment and repair development test prerequisites'
          git rev-parse HEAD > "$RUNNER_TEMP/transfer/commit.txt"
          git bundle create "$RUNNER_TEMP/transfer/candidate.bundle" HEAD
      - name: Publish a new staging branch, never overwrite an existing branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api 'repos/wmqfl861/dsh930/git/ref/heads/staging/cloud-ready' >/dev/null 2>&1; then
            echo 'staging/cloud-ready already exists; refusing to replace it' >&2
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/staging/cloud-ready
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cloud-baseline-transfer
          path: ${{ runner.temp }}/transfer/
          retention-days: 7
