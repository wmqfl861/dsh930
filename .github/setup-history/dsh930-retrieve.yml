name: dsh930 workspace transfer

on:
  push:
    branches: [dev/node24]
    paths: [.github/workflows/dsh930-retrieve.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh930-installed-workspace
          run-id: 36810567567
          github-token: ${{ github.token }}
          repository: wmqfl861/dsh930
          path: ${{ runner.temp }}/original
      - name: Split without changing the archived bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parts"
          split -b 240M -d "$RUNNER_TEMP/original/dsh930-workspace.tar.gz" "$RUNNER_TEMP/parts/workspace.part-"
          cd "$RUNNER_TEMP/parts"
          sha256sum workspace.part-* > SHA256SUMS
          sha256sum "$RUNNER_TEMP/original/dsh930-workspace.tar.gz" > ORIGINAL_SHA256
          count="$(find . -name 'workspace.part-*' | wc -l)"
          test "$count" -le 6
      - uses: actions/upload-artifact@v4
        with:
          name: dsh930-workspace-part-00
          path: ${{ runner.temp }}/parts/workspace.part-00
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dsh930-workspace-part-01
          path: ${{ runner.temp }}/parts/workspace.part-01
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dsh930-workspace-part-02
          path: ${{ runner.temp }}/parts/workspace.part-02
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dsh930-workspace-part-03
          path: ${{ runner.temp }}/parts/workspace.part-03
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dsh930-workspace-part-04
          path: ${{ runner.temp }}/parts/workspace.part-04
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dsh930-workspace-part-05
          path: ${{ runner.temp }}/parts/workspace.part-05
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dsh930-workspace-checksums
          path: |
            ${{ runner.temp }}/parts/SHA256SUMS
            ${{ runner.temp }}/parts/ORIGINAL_SHA256
          retention-days: 7
