name: dsh930 Luna configuration and gateway check
on:
  push:
    branches: [feat/alpha-luna-smoke]
    paths: ['alpha/**', '.github/workflows/dsh930-luna-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  luna:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify configuration and regression tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/luna-results"
          node --version > "$RUNNER_TEMP/luna-results/node.txt"
          node --test alpha/tests/*.test.mjs | tee "$RUNNER_TEMP/luna-results/tests.log"
          git diff --exit-code
          git rev-parse HEAD > "$RUNNER_TEMP/luna-results/source-commit.txt"
      - name: Check new module lint explicitly
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/alpha-lint" --ignore-scripts --no-audit --no-fund oxlint@1.86.0
          node "$RUNNER_TEMP/alpha-lint/node_modules/oxlint/bin/oxlint" -c alpha/oxlint.json --no-ignore alpha --threads 1 | tee "$RUNNER_TEMP/luna-results/lint.log"
      - name: Export exact tested source without credentials or runtime files
        run: |
          git bundle create "$RUNNER_TEMP/luna-source.bundle" HEAD
          git archive --format=zip --output="$RUNNER_TEMP/luna-source.zip" HEAD alpha .dsh/skills .github/workflows/dsh930-luna-check.yml
      - uses: actions/upload-artifact@v7
        with:
          name: luna-tested-source
          path: |
            ${{ runner.temp }}/luna-source.bundle
            ${{ runner.temp }}/luna-source.zip
          retention-days: 7
      - name: Check user gateway and run inference only with a configured repository Secret
        env:
          ALPHA_SMOKE_API_KEY: ${{ secrets.ALPHA_SMOKE_API_KEY }}
        run: node alpha/luna-smoke.mjs "$RUNNER_TEMP/luna-results/check"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: luna-configuration-and-gateway-results
          path: |
            ${{ runner.temp }}/luna-results/tests.log
            ${{ runner.temp }}/luna-results/lint.log
            ${{ runner.temp }}/luna-results/node.txt
            ${{ runner.temp }}/luna-results/source-commit.txt
            ${{ runner.temp }}/luna-results/check/report.json
          retention-days: 7
